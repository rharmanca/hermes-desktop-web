# Permanent loopback-only frontend; authentication remains with Hermes.
# Profile selection is not an authorization boundary for this owner login.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    server_name localhost 127.0.0.1;
    server_tokens off;
    access_log off;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location = /web-bridge.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Ordinary chat-artifact preview/download, behind existing Hermes auth.
    location ~ ^/api/fs/(download|read-data-url|read-text)$ {
        proxy_pass http://host.docker.internal:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix "";
    }

    # 2026-10-18 (Rob-approved): built-in file browser and terminal are ENABLED;
    # they remain behind Hermes login + Cloudflare Access. Only the optional
    # publisher/web-terminal plugins and events stay blocked.
    location ~ ^/api/(pub|events|plugins/web-terminal)(/|$) {
        default_type application/json;
        return 403 '{"error":"Optional publisher/web-terminal plugins are disabled"}';
    }

    location /api/ {
        proxy_pass http://host.docker.internal:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location /login {
        proxy_pass http://host.docker.internal:9119;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix "";
    }
    location /auth {
        proxy_pass http://host.docker.internal:9119;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix "";
    }
}
