name: robweb tests
# Offline layers only. Live/browser/security layers need the running server and are run there
# with: tests/run-all.sh --live --browser
on:
  push:
    branches: [robweb, "wip/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax
        run: |
          node --check web-bridge.js
          node --check deploy/robweb/web-preview.js
          python -m py_compile deploy/robweb/preview-relay/relay.py
      - name: Web bridge unit tests
        run: node --test tests/*.test.mjs
      - name: Browser-pane relay filter tests
        run: python tests/relay/test_relay_filters.py
      - name: Browser-pane relay end-to-end (real Chrome tries to reach private services)
        run: |
          python -m pip install -q websockets
          # Ubuntu 24 runners block Chrome's sandbox; allow it rather than running with --no-sandbox,
          # so CI tests the same sandboxed browser production uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          PREVIEW_CHROMIUM="$(command -v google-chrome || command -v chromium)" python tests/relay/run_relay_e2e.py
      - name: Nginx config routing + header tests (throwaway containers)
        run: bash tests/nginx/run_nginx_tests.sh
      - name: Web-terminal plugin tests (needs Hermes source; plugin stays disabled in production)
        run: |
          git clone -q --depth 1 --branch "${HERMES_REF:-v0.22.2}" https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          python -m pip install -q -e "$RUNNER_TEMP/hermes-agent[web]" pytest httpx || python -m pip install -q -e "$RUNNER_TEMP/hermes-agent" pytest httpx
          HERMES_HOME="$RUNNER_TEMP/hh" PYTHONPATH="$RUNNER_TEMP/hermes-agent" python -m pytest gateway-plugin/web-terminal/tests -q -o addopts="" -p no:cacheprovider
      - name: Shell scripts lint
        run: shellcheck -S error tests/*.sh tests/nginx/*.sh
